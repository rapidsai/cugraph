[tool.ruff]
line-length = 88
exclude = [
    "__init__.py",
]

[tool.ruff.lint]
ignore = [
    "E203",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "F401",
    "F841",
]

[tool.codespell]
# note: pre-commit passes explicit lists of files here, which this skip file list doesn't override -
# this is only to allow you to run codespell interactively
skip = "./.git,./cpp/build,.*egg-info.*,./.mypy_cache,.*_skbuild,CHANGELOG.md,./thirdparty,./cpp/tests/utilities/cxxopts.hpp"
# ignore short words, typename parameters like OffsetT, and URLs
ignore-regex = "\\b(.{1,4}|[A-Z]\\w*T)\\b|https?://\\S+"
ignore-words-list = "inout,numer,startd,thirdparty"
# use the 'clear' dictionary for unambiguous spelling mistakes
builtin = "clear"
# disable warnings about binary files and wrong encoding
quiet-level = 3
